<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARO - Lobby</title>
    <link rel="stylesheet" href="/static/styles/lobby.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="lobby">
        <header class="lobby__header">
            <div class="header__title">Bida ng mga ligax    </div>
            <a class="header__leave" href="/">✕ Leave</a>
        </header>

        <main class="lobby__main">
            <button class="start-btn">Start Game</button>
            

            <section class="players">
                <article class="player player--you">
                    <div class="avatar avatar--you"></div>
                    <h3 class="player__name">YOU</h3>
                    <button class="join-btn">+ JOIN</button>
                </article>

                <article class="player">
                    <div class="avatar"></div>
                    <h3 class="player__name">Player 2</h3>
                    <button class="join-btn">+ JOIN</button>
                </article>

                <article class="player">
                    <div class="avatar"></div>
                    <h3 class="player__name">Player 3</h3>
                    <button class="join-btn">+ JOIN</button>
                </article>

                <article class="player">
                    <div class="avatar"></div>
                    <h3 class="player__name">Player 4</h3>
                    <button class="join-btn">+ JOIN</button>
                </article>

                <article class="player">
                    <div class="avatar"></div>
                    <h3 class="player__name">Player 5</h3>
                    <button class="join-btn">+ JOIN</button>
                </article>
            </section>
            <section class="players">
                <article class="player">
                    <div class="avatar"></div>
                    <h3 class="player__name">Player 1</h3>
                    <button class="join-btn">+ JOIN</button>
                </article>

                <article class="player">
                    <div class="avatar"></div>
                    <h3 class="player__name">Player 2</h3>
                    <button class="join-btn">+ JOIN</button>
                </article>

                <article class="player">
                    <div class="avatar"></div>
                    <h3 class="player__name">Player 3</h3>
                    <button class="join-btn">+ JOIN</button>
                </article>

                <article class="player">
                    <div class="avatar"></div>
                    <h3 class="player__name">Player 4</h3>
                    <button class="join-btn">+ JOIN</button>
                </article>

                <article class="player">
                    <div class="avatar"></div>
                    <h3 class="player__name">Player 5</h3>
                    <button class="join-btn">+ JOIN</button>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
